name: Deploy Knistertap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Build type (preview keeps draft labels and noindex)
        type: choice
        options:
          - preview
          - release
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website
        env:
          KNISTERTAP_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BUILD_MODE: ${{ inputs.mode || 'preview' }}
        run: |
          if [ "$BUILD_MODE" = "release" ]; then
            npm run build:release
          else
            npm run build
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
